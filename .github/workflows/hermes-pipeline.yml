# Hermes pipeline — lanza Cloud Agents via API (sin Automations por repo)
#
# Requiere secret del repo/org: CURSOR_API_KEY
# Docs control plane: (en Orchestrator) docs/pipeline-cloud-agents-api.md
#
# Triggers:
#   - Issue labeled hermes/todo  → Plan
#   - Issue comment / PR review comment with line APROBADO → Implement
#   - Issue comment / PR review comment with line REHACER → Replan (plan prompt)

name: Hermes pipeline

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide mode + launch Cursor agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER_FROM_REVIEW: ${{ github.event.pull_request.number }}
          PR_HTML_FROM_REVIEW: ${{ github.event.pull_request.html_url }}
          ISSUE_PR_API_URL: ${{ github.event.issue.pull_request.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, json, os, pathlib, re, subprocess, sys, urllib.error, urllib.request

          def fail(msg, code=1):
              print(msg, file=sys.stderr)
              sys.exit(code)

          def extract_playbook(path):
              raw = path.read_text(encoding="utf-8")
              marker = "## Instructions (copy from here)"
              if marker in raw:
                  return raw.split(marker, 1)[1].strip()
              return raw.strip()

          def line_command(body, cmd):
              if not body:
                  return False
              for line in body.splitlines():
                  s = line.strip()
                  if s == cmd or s.startswith(cmd + " ") or s.startswith(cmd + "\t"):
                      return True
              return False

          def join_prompt(header_lines, playbook):
              return "\n".join(header_lines) + "\n\n--- PLAYBOOK BELOW ---\n\n" + playbook

          def gh_comment(target_kind, number, body_text):
              """Post comment on issue or PR so the human sees the agent link."""
              if not number:
                  return
              repo = os.environ.get("REPO", "")
              try:
                  if target_kind == "pr":
                      subprocess.run(
                          ["gh", "pr", "comment", str(number), "--repo", repo, "--body", body_text],
                          check=False,
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )
                  else:
                      subprocess.run(
                          ["gh", "issue", "comment", str(number), "--repo", repo, "--body", body_text],
                          check=False,
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )
              except Exception as ex:
                  print("No se pudo comentar en GitHub: %s" % ex, file=sys.stderr)

          api_key = os.environ.get("CURSOR_API_KEY", "").strip()
          if not api_key:
              print("CURSOR_API_KEY no configurado en secrets — skip.")
              sys.exit(0)

          repo = os.environ["REPO"]
          repo_url = "https://github.com/" + repo
          default_branch = os.environ.get("DEFAULT_BRANCH") or "main"
          event = os.environ.get("EVENT_NAME", "")

          mode = None
          issue_number = None
          pr_url = None
          pr_number = None

          if event == "issues":
              if os.environ.get("LABEL_NAME") == "hermes/todo":
                  mode = "plan"
                  issue_number = int(os.environ["ISSUE_NUMBER"])
          elif event in ("issue_comment", "pull_request_review_comment"):
              body = os.environ.get("COMMENT_BODY") or ""
              if line_command(body, "APROBADO"):
                  mode = "implement"
              elif line_command(body, "REHACER"):
                  mode = "replan"
              else:
                  print("Comentario sin APROBADO/REHACER — nada que lanzar.")
                  sys.exit(0)

              if event == "pull_request_review_comment":
                  pr_url = os.environ.get("PR_HTML_FROM_REVIEW") or ""
                  pr_number = int(os.environ.get("PR_NUMBER_FROM_REVIEW") or 0) or None
                  issue_number = pr_number
              else:
                  n = int(os.environ.get("ISSUE_NUMBER") or 0)
                  issue_number = n or None
                  pr_api = (os.environ.get("ISSUE_PR_API_URL") or "").strip()
                  if pr_api:
                      m = re.search(r"/repos/([^/]+)/([^/]+)/pulls/(\d+)", pr_api)
                      if m:
                          pr_number = int(m.group(3))
                          pr_url = "https://github.com/%s/%s/pull/%s" % (m.group(1), m.group(2), m.group(3))
                      else:
                          pr_url = "%s/pull/%s" % (repo_url, n)
                          pr_number = n
                  elif mode == "implement":
                      fail("APROBADO solo aplica en comentarios de un Pull Request.")

          if not mode:
              print("Evento no maneja este pipeline — exit 0.")
              sys.exit(0)

          root = pathlib.Path(".cursor/pipeline")
          plan_file = root / "automation-plan.prompt.md"
          impl_file = root / "automation-implement.prompt.md"

          if mode in ("plan", "replan"):
              if not plan_file.is_file():
                  fail("Falta %s — sync pipeline desde Orchestrator y commitea." % plan_file)
              playbook = extract_playbook(plan_file)
              if not issue_number:
                  fail("Falta numero de issue para plan/replan")
              header = [
                  "# Hermes launcher context (GitHub Actions + Cloud Agents API)",
                  "",
                  "Mode: %s" % mode,
                  "Repository: %s" % repo_url,
                  "Issue number: %s" % issue_number,
                  "Issue URL: %s/issues/%s" % (repo_url, issue_number),
              ]
              if pr_url:
                  header.append("Pull Request: %s" % pr_url)
              header.extend([
                  "",
                  "Constraints:",
                  "- Work only on issue #%s." % issue_number,
                  "- Skills under .cursor/skills/; pipeline under .cursor/pipeline/.",
                  "- Follow the playbook completely. Never merge to default branch.",
                  "- When you start, leave a short comment on the issue (or PR) that you are working.",
              ])
              prompt = join_prompt(header, playbook)
              name = "hermes-%s #%s" % (mode, issue_number)
              if pr_url:
                  payload = {
                      "prompt": {"text": prompt},
                      "name": name,
                      "repos": [{"url": repo_url, "prUrl": pr_url}],
                      "workOnCurrentBranch": True,
                      "autoCreatePR": False,
                  }
              else:
                  payload = {
                      "prompt": {"text": prompt},
                      "name": name,
                      "repos": [{"url": repo_url, "startingRef": default_branch}],
                      # Cursor must open PR when the agent finishes. Cloud Agent git push
                      # often works, but gh PR create without this flag frequently does not.
                      "autoCreatePR": True,
                  }
          else:
              if not impl_file.is_file():
                  fail("Falta %s — sync pipeline desde Orchestrator y commitea." % impl_file)
              if not pr_url:
                  fail("Implement requiere URL de PR")
              playbook = extract_playbook(impl_file)
              header = [
                  "# Hermes launcher context (GitHub Actions + Cloud Agents API)",
                  "",
                  "Mode: implement",
                  "Repository: %s" % repo_url,
                  "Pull Request: %s" % pr_url,
                  "",
                  "Constraints:",
                  "- Only if human APROBADO gate on this PR passes (playbook).",
                  "- Work on this PR branch. Never merge to default branch.",
              ]
              prompt = join_prompt(header, playbook)
              name = "hermes-impl PR"
              payload = {
                  "prompt": {"text": prompt},
                  "name": name,
                  "repos": [{"url": repo_url, "prUrl": pr_url}],
                  "workOnCurrentBranch": True,
                  "autoCreatePR": False,
              }

          data = json.dumps(payload).encode("utf-8")
          auth = base64.b64encode(("%s:" % api_key).encode("utf-8")).decode("ascii")
          req = urllib.request.Request(
              "https://api.cursor.com/v1/agents",
              data=data,
              method="POST",
              headers={
                  "Authorization": "Basic %s" % auth,
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  body = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              err = e.read().decode("utf-8", errors="replace")
              msg = "Cursor API HTTP %s: %s" % (e.code, err)
              if mode == "implement" and pr_number:
                  gh_comment("pr", pr_number, "## Hermes pipeline\n\nNo pude lanzar el Cloud Agent.\n\n```\n%s\n```" % msg[:1500])
              elif issue_number:
                  gh_comment("issue", issue_number, "## Hermes pipeline\n\nNo pude lanzar el Cloud Agent (Plan).\n\n```\n%s\n```" % msg[:1500])
              fail(msg)

          agent = body.get("agent") or body
          agent_id = agent.get("id")
          agent_url = agent.get("url") or "https://cursor.com/agents"
          run_id = agent.get("latestRunId") or (body.get("run") or {}).get("id")
          print("Launched Cloud Agent")
          print("  id :", agent_id)
          print("  url:", agent_url)
          print("  run:", run_id)

          # Feedback visible en GitHub (antes el Action solo escribía en logs)
          human = [
              "## Hermes pipeline — agent encolado",
              "",
              "- **Modo:** `%s`" % mode,
              "- **Cloud Agent:** %s" % agent_url,
              "- Agent id: `%s`" % (agent_id or "?"),
          ]
          if run_id:
              human.append("- Run id: `%s`" % run_id)
          human.extend([
              "",
              "El agent corre en Cursor (puede tardar varios minutos). Cuando termine debería abrir/actualizar un **draft PR** y cambiar labels.",
              "",
              "_Si no ves avance: abrí el link del agent o revisá Actions → Hermes pipeline._",
          ])
          human_body = "\n".join(human)
          if mode == "implement" and pr_number:
              gh_comment("pr", pr_number, human_body)
          elif issue_number:
              gh_comment("issue", issue_number, human_body)
          PY
